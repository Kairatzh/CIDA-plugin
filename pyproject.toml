[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cida-plugin"
version = "1.4.2"
description = "Universal Evidence-Grounded Deliberation Layer with Agentic Inference Engine & Multi-Agent Swarm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Kairat Zhaksylykov", email = "zhaksylykov.k06@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: Apache Software License"
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.0",
  "huggingface_hub>=0.14.0",
  "torchdiffeq>=0.2.3",
  "requests>=2.28"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.3.0",
  "black>=24.0.0"
]

[project.urls]
Homepage = "https://github.com/Kairatzh/CIDA-plugin"
Repository = "https://github.com/Kairatzh/CIDA-plugin.git"
Documentation = "https://github.com/Kairatzh/CIDA-plugin#readme"
Issues = "https://github.com/Kairatzh/CIDA-plugin/issues"

[tool.setuptools]
packages = ["cida_plugin", "cida_plugin.inference", "cida_latent_plugin", "cida_inference", "kairos_loop", "cida_swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=cida_plugin --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ['py310']
